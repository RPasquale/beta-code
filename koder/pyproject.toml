[project]
name = "koder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # IMPORTANT: Install PyTorch with CUDA 12.6 FIRST using:
    # uv pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu126
    # Then run: uv sync (this will install remaining dependencies)
    "torch>=2.0.0",  # Will use already-installed CUDA version if installed first
    "torch-geometric>=2.3.0",
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",  # Optional but recommended for kNN
    "pyarrow>=12.0.0",  # Optional but recommended for parquet support
    "datasets>=2.12.0",  # HuggingFace datasets
]
