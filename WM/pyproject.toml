[project]
name = "wm"
version = "0.1.0"
description = "World Model + Graph GRPO + ColBERT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # Core ML
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "numpy>=1.24.0",
    # Optional but recommended
    "scikit-learn>=1.3.0", # For KMeans clustering in ColBERT index
    "datasets>=2.12.0", # HuggingFace datasets
    "tqdm>=4.65.0", # Progress bars
    # Optional logging
    "wandb>=0.15.0", # Weights & Biases (optional)
    # Optional: PEFT for LoRA (if using WM_USE_LORA=1)
    "peft>=0.5.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

